<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7178"/></marker>
<marker id="pv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e8b6f"/></marker>
<marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5495b"/></marker>
<pattern id="rayas" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#3b6ea5" stroke-opacity="0.22" stroke-width="1.5"/></pattern>
</defs>
<rect width="980" height="500" fill="#ffffff"/>
<text x="16" y="30" font-size="17" fill="#22252a" text-anchor="start" font-weight="600">Cómo se decide un request</text>
<text x="16" y="46" font-size="12" fill="#6b7178" text-anchor="start">la frontera entre percepción estocástica y control determinista organiza toda la decisión</text>
<rect x="16" y="58" width="948" height="260" rx="10" fill="#f4f7fa" stroke="#d8dbdf"/>
<text x="30" y="336" font-size="12" fill="#3b6ea5" text-anchor="start" font-weight="700">LO QUE DECIDE EL CÓDIGO · determinista, contable, auditable</text>
<rect x="30" y="84" width="200" height="100" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/><g transform="translate(40,98)" fill="none" stroke="#3b6ea5" stroke-width="1.5"><path d="M1 10L10 1l3 3-9 9z"/><path d="M4 7l1 1M6 5l1 1M8 3l1 1"/></g><text x="62" y="107" font-size="11.5" fill="#22252a" text-anchor="start" font-weight="600">1 · sensores</text><text x="62" y="121" font-size="9.3" fill="#6b7178" text-anchor="start">forma cerrada, sin modelo</text><line x1="38" y1="133" x2="222" y2="133" stroke="#d8dbdf" stroke-dasharray="2 3"/><g transform="translate(40,140)" fill="none" stroke="#3b6ea5" stroke-width="1.5"><path d="M7 1l6 3-6 3-6-3z"/><path d="M1 7l6 3 6-3M1 10l6 3 6-3"/></g><text x="62" y="149" font-size="11.5" fill="#22252a" text-anchor="start" font-weight="600">2 · creencias tipadas</text><text x="62" y="163" font-size="9.3" fill="#6b7178" text-anchor="start">con procedencia, de ASSUMED a COMPUTED</text><text x="130.0" y="200" font-size="11.5" fill="#3b6ea5" text-anchor="middle" font-weight="700">sensar</text>
<rect x="262" y="84" width="262" height="184" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/><g transform="translate(272,98)" fill="none" stroke="#3b6ea5" stroke-width="1.5"><path d="M1 1h12L8 7v5l-2 1V7z"/></g><text x="294" y="107" font-size="11.5" fill="#22252a" text-anchor="start" font-weight="600">3 · portón de factibilidad</text><text x="294" y="121" font-size="9.3" fill="#6b7178" text-anchor="start">aritmética pura: ¿entra en el presupuesto?</text><line x1="270" y1="133" x2="516" y2="133" stroke="#d8dbdf" stroke-dasharray="2 3"/><g transform="translate(272,140)" fill="none" stroke="#3b6ea5" stroke-width="1.5"><path d="M1 1h6l6 6-6 6-6-6z"/><circle cx="4" cy="4" r="1"/></g><text x="294" y="149" font-size="11.5" fill="#22252a" text-anchor="start" font-weight="600">4 · capacidades exigidas</text><text x="294" y="163" font-size="9.3" fill="#6b7178" text-anchor="start">ontología de la pregunta → capacidades</text><line x1="270" y1="175" x2="516" y2="175" stroke="#d8dbdf" stroke-dasharray="2 3"/><g transform="translate(272,182)" fill="none" stroke="#3b6ea5" stroke-width="1.5"><path d="M2 7l3 3 7-7"/></g><text x="294" y="191" font-size="11.5" fill="#22252a" text-anchor="start" font-weight="600">5 · brazos candidatos</text><text x="294" y="205" font-size="9.3" fill="#6b7178" text-anchor="start">los que tienen TODAS las exigidas</text><line x1="270" y1="217" x2="516" y2="217" stroke="#d8dbdf" stroke-dasharray="2 3"/><g transform="translate(272,224)" fill="none" stroke="#3b6ea5" stroke-width="1.5"><path d="M1 11a6 6 0 0 1 12 0"/><path d="M7 11L10 5"/></g><text x="294" y="233" font-size="11.5" fill="#22252a" text-anchor="start" font-weight="600">6 · dial de garantía</text><text x="294" y="247" font-size="9.3" fill="#6b7178" text-anchor="start">max(caller, request, piso aprendido)</text><text x="393.0" y="284" font-size="11.5" fill="#3b6ea5" text-anchor="middle" font-weight="700">acotar</text>
<rect x="556" y="84" width="200" height="100" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/><g transform="translate(566,98)" fill="none" stroke="#3b6ea5" stroke-width="1.5"><path d="M2 7h4m0 0l4-4h3M6 7l4 4h3"/></g><text x="588" y="107" font-size="11.5" fill="#22252a" text-anchor="start" font-weight="600">7 · elegir o abstenerse</text><text x="588" y="121" font-size="9.3" fill="#6b7178" text-anchor="start">entre los que empatan, el más barato</text><line x1="564" y1="133" x2="748" y2="133" stroke="#d8dbdf" stroke-dasharray="2 3"/><g transform="translate(566,140)" fill="none" stroke="#3b6ea5" stroke-width="1.5"><rect x="1" y="2" width="12" height="10"/><path d="M1 6h12M5 2v10M9 2v10"/></g><text x="588" y="149" font-size="11.5" fill="#22252a" text-anchor="start" font-weight="600">8 · EXPLAIN</text><text x="588" y="163" font-size="9.3" fill="#6b7178" text-anchor="start">qué se creyó, con qué procedencia</text><text x="656.0" y="200" font-size="11.5" fill="#3b6ea5" text-anchor="middle" font-weight="700">decidir</text>
<line x1="230" y1="129" x2="260" y2="129" stroke="#6b7178" stroke-width="1.6" marker-end="url(#p)"/>
<line x1="524" y1="129" x2="554" y2="129" stroke="#6b7178" stroke-width="1.6" marker-end="url(#p)"/>
<line x1="756" y1="129" x2="786" y2="129" stroke="#6b7178" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="788" y="84" width="166" height="128" rx="7" fill="#ffffff" stroke="#2e8b6f" stroke-width="1.6"/>
<text x="871.0" y="106" font-size="12" fill="#22252a" text-anchor="middle" font-weight="600">el brazo elegido ejecuta</text>
<rect x="798" y="118" width="146" height="82" rx="5" fill="url(#rayas)" stroke="#3b6ea5" stroke-width="1.2"/>
<text x="871.0" y="136" font-size="10.5" fill="#3b6ea5" text-anchor="middle" font-weight="700">el bucle es del código</text>
<text x="871.0" y="152" font-size="10.5" fill="#3b6ea5" text-anchor="middle">cuántas vueltas</text>
<text x="871.0" y="166" font-size="10.5" fill="#3b6ea5" text-anchor="middle">qué índice</text>
<text x="871.0" y="180" font-size="10.5" fill="#3b6ea5" text-anchor="middle">cuándo parar</text>
<text x="871.0" y="228" font-size="11.5" fill="#2e8b6f" text-anchor="middle" font-weight="700">ejecutar</text>
<rect x="16" y="348" width="948" height="112" rx="10" fill="#fdf5f6" stroke="#d8dbdf"/>
<text x="30" y="480" font-size="12" fill="#b5495b" text-anchor="start" font-weight="700">LO QUE EMITE EL MODELO · sensor: proposiciones, nunca flujo de control</text>
<g transform="translate(96,398) scale(1.0)">
<line x1="0" y1="-30" x2="0" y2="-20" stroke="#b5495b" stroke-width="2"/><circle cx="0" cy="-32" r="3" fill="#b5495b"/>
<rect x="-24" y="-20" width="48" height="36" rx="8" fill="#ffffff" stroke="#b5495b" stroke-width="2"/>
<circle cx="-9" cy="-3" r="4.5" fill="#b5495b"/><circle cx="9" cy="-3" r="4.5" fill="#b5495b"/>
<line x1="-10" y1="8" x2="10" y2="8" stroke="#b5495b" stroke-width="2"/>
<rect x="-30" y="-10" width="6" height="14" rx="2" fill="#b5495b"/><rect x="24" y="-10" width="6" height="14" rx="2" fill="#b5495b"/>
</g>
<text x="96" y="448" font-size="11.5" fill="#22252a" text-anchor="middle" font-weight="600">LLM</text>
<rect x="176" y="370" width="210" height="60" rx="7" fill="#ffffff" stroke="#b5495b" stroke-width="1.6"/>
<text x="281" y="392" font-size="12" fill="#22252a" text-anchor="middle" font-weight="600">extraer un hecho</text>
<text x="281" y="410" font-size="9.8" fill="#6b7178" text-anchor="middle">«¿qué dice esta unidad?»</text>
<rect x="414" y="370" width="210" height="60" rx="7" fill="#ffffff" stroke="#b5495b" stroke-width="1.6"/>
<text x="519" y="392" font-size="12" fill="#22252a" text-anchor="middle" font-weight="600">proponer el próximo paso</text>
<text x="519" y="410" font-size="9.8" fill="#6b7178" text-anchor="middle">«¿hacia dónde sigue el rastro?»</text>
<line x1="624" y1="400" x2="650" y2="400" stroke="#b5495b" stroke-width="1.6" marker-end="url(#pr)"/>
<rect x="652" y="370" width="290" height="60" rx="7" fill="#ffffff" stroke="#b5495b" stroke-width="1.6"/>
<text x="797" y="392" font-size="12" fill="#22252a" text-anchor="middle" font-weight="600">la salida se TIPA antes de usarse</text>
<text x="797" y="410" font-size="9.8" fill="#6b7178" text-anchor="middle">«M. Arrieta settlement account» → entidad: M. Arrieta</text>
<line x1="828" y1="212" x2="828" y2="368" stroke="#b5495b" stroke-width="1.6" marker-end="url(#pr)"/>
<text x="824" y="300" font-size="10.5" fill="#b5495b" text-anchor="end" font-style="italic">pregunta</text>
<line x1="924" y1="368" x2="924" y2="214" stroke="#b5495b" stroke-width="1.6" marker-end="url(#pr)"/>
<text x="918" y="300" font-size="10.5" fill="#b5495b" text-anchor="end" font-style="italic">proposición</text>
<line x1="148" y1="398" x2="174" y2="398" stroke="#b5495b" stroke-width="1.6" marker-end="url(#pr)"/>
<text x="16" y="492" font-size="10.5" fill="#6b7178" text-anchor="start">Una decisión delegada puede abrir un canal desde el modelo hacia el control: en muestra, el ancla elegida por el modelo dio u=1,000 / 0,000 / 0,000 con la misma huella.</text>
