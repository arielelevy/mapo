<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4046"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="420" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2328">La interfaz aprendible: de la pregunta a los brazos capaces, sin pasar por un nombre</text>

  <!-- carril superior: COMPUTED -->
  <rect x="30" y="62" width="1120" height="26" fill="#eef3f8" stroke="none"/>
  <text x="44" y="80" font-size="12" fill="#3b6ea5" font-weight="600">procedencia COMPUTED · lo que el código puede exhibir</text>

  <!-- caja 1: pregunta -->
  <rect x="40" y="112" width="200" height="120" rx="8" fill="#f7f8fa" stroke="#3b6ea5" stroke-width="1.6"/>
  <text x="140" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">pregunta q + material M</text>
  <text x="140" y="164" text-anchor="middle" font-size="12" fill="#3b4046">cardinalidad de la respuesta</text>
  <text x="140" y="182" text-anchor="middle" font-size="12" fill="#3b4046">cobertura demandada</text>
  <text x="140" y="200" text-anchor="middle" font-size="12" fill="#3b4046">literal, continuidad, ancho</text>
  <text x="140" y="222" text-anchor="middle" font-size="11" fill="#6b7178" font-style="italic">declarado por el caller o medido</text>

  <!-- flecha 1 -->
  <line x1="240" y1="172" x2="300" y2="172" stroke="#3b4046" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="270" y="160" text-anchor="middle" font-size="11" fill="#6b7178">ejes</text>

  <!-- caja 2: ontología -->
  <rect x="300" y="112" width="220" height="120" rx="8" fill="#f7f8fa" stroke="#3b6ea5" stroke-width="1.6"/>
  <text x="410" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">eje de la pregunta</text>
  <text x="410" y="164" text-anchor="middle" font-size="12" fill="#3b4046">cadena acoplada · contradicción</text>
  <text x="410" y="182" text-anchor="middle" font-size="12" fill="#3b4046">cobertura exhaustiva · ausencia</text>
  <text x="410" y="200" text-anchor="middle" font-size="12" fill="#3b4046">horizonte · entidad · ventana</text>
  <text x="410" y="222" text-anchor="middle" font-size="11" fill="#6b7178" font-style="italic">§7.4.3: S/R 2,53 con 5 segmentos, nulo p95 1,46</text>

  <!-- flecha 2 -->
  <line x1="520" y1="172" x2="580" y2="172" stroke="#3b4046" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="550" y="160" text-anchor="middle" font-size="11" fill="#6b7178">EXIGE</text>

  <!-- caja 3: capacidades -->
  <rect x="580" y="112" width="240" height="120" rx="8" fill="#f7f8fa" stroke="#3b6ea5" stroke-width="1.6"/>
  <text x="700" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">capacidades exigidas</text>
  <text x="700" y="164" text-anchor="middle" font-size="12" fill="#3b4046">RESOLVER_REFERENCIA</text>
  <text x="700" y="182" text-anchor="middle" font-size="12" fill="#3b4046">LARGO_GOBERNADO_POR_CODIGO</text>
  <text x="700" y="200" text-anchor="middle" font-size="12" fill="#3b4046">ADAPTA · … (diez en total)</text>
  <text x="700" y="222" text-anchor="middle" font-size="11" fill="#6b7178" font-style="italic">tabla por eje, nunca por celda</text>

  <!-- flecha 3 -->
  <line x1="820" y1="172" x2="880" y2="172" stroke="#3b4046" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="850" y="160" text-anchor="middle" font-size="11" fill="#6b7178">⊆ TIENE(p)</text>

  <!-- caja 4: capaces -->
  <rect x="880" y="112" width="260" height="120" rx="8" fill="#f7f8fa" stroke="#3b6ea5" stroke-width="1.6"/>
  <text x="1010" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">brazos capaces, un conjunto</text>
  <text x="1010" y="164" text-anchor="middle" font-size="12" fill="#3b4046">{ p : EXIGE(e) ⊆ TIENE(p) }</text>
  <text x="1010" y="182" text-anchor="middle" font-size="12" fill="#3b4046">entre ellos decide el costo</text>
  <text x="1010" y="200" text-anchor="middle" font-size="12" fill="#3b4046">vacío ⇒ hueco del catálogo</text>
  <text x="1010" y="222" text-anchor="middle" font-size="11" fill="#6b7178" font-style="italic">§7.3.5: 58% de ahorro a utilidad igual</text>

  <!-- carril inferior: declaraciones desde el código -->
  <rect x="30" y="268" width="1120" height="26" fill="#f6f8fb" stroke="none"/>
  <text x="44" y="286" font-size="12" fill="#3b6ea5" font-weight="600">declarado desde el código de cada brazo, auditado contra el registro</text>

  <rect x="580" y="312" width="560" height="78" rx="8" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="860" y="338" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">TIENE(p): qué capacidades tiene cada brazo, y dónde se ve en su código</text>
  <text x="860" y="360" text-anchor="middle" font-size="12" fill="#3b4046">un brazo que declara ABSTIENE_SIN_PRUEBA y nunca se abstuvo tiene una declaración falsa</text>
  <text x="860" y="378" text-anchor="middle" font-size="11" fill="#6b7178" font-style="italic">vale para un brazo que todavía no corrió: leave-one-arm-out, §7.4.1</text>
  <line x1="1010" y1="312" x2="1010" y2="232" stroke="#9aa4ae" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar)"/>

  <rect x="40" y="312" width="500" height="78" rx="8" fill="#ffffff" stroke="#9aa4ae" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="290" y="338" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">lo que NO entra en la clave</text>
  <text x="290" y="360" text-anchor="middle" font-size="12" fill="#3b4046">el nombre del paradigma (P15: −0,087) · un eje elicitado (§7.3.6: 27% de tareas cambian de región)</text>
  <text x="290" y="378" text-anchor="middle" font-size="11" fill="#6b7178" font-style="italic">Proposición 5.7: una clave elicitada vuelve la tabla una variable aleatoria</text>
</svg>
