<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7178"/></marker>
<marker id="pv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e8b6f"/></marker>
<marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5495b"/></marker>
<pattern id="rayas" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#3b6ea5" stroke-opacity="0.22" stroke-width="1.5"/></pattern>
</defs>
<rect width="980" height="470" fill="#ffffff"/>
<text x="16" y="28" font-size="17" fill="#22252a" text-anchor="start" font-weight="600">El contrato de garantía, y qué pasa cuando la evidencia no alcanza</text>
<text x="16" y="45" font-size="11" fill="#6b7178" text-anchor="start">la abstención es una salida, no un fallo · y el rechazo sube el piso para el próximo request, sin tocar un peso</text>
<rect x="16" y="58" width="948" height="262" rx="10" fill="#f4f7fa" stroke="#d8dbdf"/>
<text x="30" y="338" font-size="11" fill="#3b6ea5" text-anchor="start" font-weight="700">LO QUE DECIDE EL CÓDIGO · determinista, contable, auditable</text>
<rect x="30" y="88" width="168" height="136" rx="7" fill="#ffffff" stroke="#6b7178" stroke-width="1.6"/><g transform="translate(40,102)" fill="none" stroke="#6b7178" stroke-width="1.5"><path d="M2 1h7l3 3v9H2z"/><path d="M4 7h6M4 10h6"/></g><text x="62" y="111" font-size="11.5" fill="#22252a" text-anchor="start" font-weight="600">material</text><text x="62" y="125" font-size="9.3" fill="#6b7178" text-anchor="start">unidades del corpus</text><line x1="38" y1="135" x2="190" y2="135" stroke="#d8dbdf" stroke-dasharray="2 3"/><g transform="translate(40,142)" fill="none" stroke="#6b7178" stroke-width="1.5"><circle cx="7" cy="7" r="6"/><path d="M7 4v6M5 6h4M5 8h4"/></g><text x="62" y="151" font-size="11.5" fill="#22252a" text-anchor="start" font-weight="600">presupuesto</text><text x="62" y="165" font-size="9.3" fill="#6b7178" text-anchor="start">tokens disponibles</text><line x1="38" y1="175" x2="190" y2="175" stroke="#d8dbdf" stroke-dasharray="2 3"/><g transform="translate(40,182)" fill="none" stroke="#6b7178" stroke-width="1.5"><path d="M3 13V1M3 2h8l-2 3 2 3H3"/></g><text x="62" y="191" font-size="11.5" fill="#22252a" text-anchor="start" font-weight="600">banderas de riesgo</text><text x="62" y="205" font-size="9.3" fill="#6b7178" text-anchor="start">irreversible · shared · regulated</text><text x="114.0" y="240" font-size="11.5" fill="#6b7178" text-anchor="middle" font-weight="700">request · lo declara el caller</text>
<rect x="226" y="118" width="156" height="68" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
<g transform="translate(236,126)" fill="none" stroke="#3b6ea5" stroke-width="1.5"><path d="M1 10L10 1l3 3-9 9z"/><path d="M4 7l1 1M6 5l1 1M8 3l1 1"/></g>
<text x="312.0" y="142" font-size="13" fill="#22252a" text-anchor="middle" font-weight="600">1 · factibilidad</text>
<text x="304.0" y="160" font-size="9.8" fill="#6b7178" text-anchor="middle">una desigualdad,</text>
<text x="304.0" y="173" font-size="9.8" fill="#6b7178" text-anchor="middle">no una estimación</text>
<rect x="410" y="118" width="156" height="68" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
<g transform="translate(420,126)" fill="none" stroke="#3b6ea5" stroke-width="1.5"><path d="M1 11a6 6 0 0 1 12 0"/><path d="M7 11L10 5"/></g>
<text x="496.0" y="142" font-size="13" fill="#22252a" text-anchor="middle" font-weight="600">2 · piso exigido</text>
<text x="488.0" y="160" font-size="9.8" fill="#6b7178" text-anchor="middle">A0–A3, derivado de</text>
<text x="488.0" y="173" font-size="9.8" fill="#6b7178" text-anchor="middle">creencias del request</text>
<rect x="594" y="118" width="156" height="68" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
<g transform="translate(604,126)" fill="none" stroke="#3b6ea5" stroke-width="1.5"><path d="M1 1h12L8 7v5l-2 1V7z"/></g>
<text x="680.0" y="142" font-size="13" fill="#22252a" text-anchor="middle" font-weight="600">3 · admisibles</text>
<text x="672.0" y="160" font-size="9.8" fill="#6b7178" text-anchor="middle">los que alcanzan</text>
<text x="672.0" y="173" font-size="9.8" fill="#6b7178" text-anchor="middle">el piso</text>
<line x1="198" y1="152.0" x2="224" y2="152.0" stroke="#6b7178" stroke-width="1.6" marker-end="url(#p)"/>
<line x1="382" y1="152.0" x2="408" y2="152.0" stroke="#6b7178" stroke-width="1.6" marker-end="url(#p)"/>
<line x1="566" y1="152.0" x2="592" y2="152.0" stroke="#6b7178" stroke-width="1.6" marker-end="url(#p)"/>
<line x1="750" y1="152.0" x2="776" y2="152.0" stroke="#6b7178" stroke-width="1.6" marker-end="url(#p)"/>
<path d="M786 152.0 q10 0 10 -10 v-22 q0 -10 10 -10 M786 152.0 q10 0 10 10 v40 q0 10 10 10" fill="none" stroke="#6b7178" stroke-width="1.6"/>
<rect x="810" y="84" width="148" height="56" rx="7" fill="#ffffff" stroke="#2e8b6f" stroke-width="1.6"/>
<g transform="translate(818,92)" fill="none" stroke="#2e8b6f" stroke-width="1.5"><path d="M2 7l3 3 7-7"/></g>
<text x="892" y="106" font-size="12" fill="#22252a" text-anchor="middle" font-weight="600">ejecuta y responde</text>
<text x="884" y="125" font-size="8.8" fill="#2e8b6f" text-anchor="middle" font-style="italic">alguna procedencia alcanzó el piso</text>
<rect x="810" y="188" width="148" height="56" rx="7" fill="#ffffff" stroke="#b5495b" stroke-width="1.6"/>
<g transform="translate(818,196)" fill="none" stroke="#b5495b" stroke-width="1.5"><path d="M2 7h4m0 0l4-4h3M6 7l4 4h3"/></g>
<text x="894" y="210" font-size="12" fill="#22252a" text-anchor="middle" font-weight="600">se abstiene o difiere</text>
<text x="884" y="229" font-size="8.8" fill="#b5495b" text-anchor="middle" font-style="italic">ninguna procedencia alcanzó el piso</text>
<text x="884" y="262" font-size="9" fill="#6b7178" text-anchor="middle" font-style="italic">toda decisión termina en una de las dos</text>
<path d="M950 244 v44 H488 V188" fill="none" stroke="#2e8b6f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#pv)"/>
<text x="690" y="302" font-size="9.5" fill="#2e8b6f" text-anchor="middle" font-style="italic">el registro de rechazos sube el piso del próximo request · offline, con guarda anti-regresión, sin tocar un peso</text>
<rect x="16" y="350" width="948" height="88" rx="10" fill="#fdf5f6" stroke="#d8dbdf"/>
<text x="30" y="456" font-size="11" fill="#b5495b" text-anchor="start" font-weight="700">LO QUE EMITE EL MODELO · un sensor estocástico con los pesos congelados</text>
<g transform="translate(120,396) scale(1.0)">
<line x1="0" y1="-30" x2="0" y2="-20" stroke="#b5495b" stroke-width="2"/><circle cx="0" cy="-32" r="3" fill="#b5495b"/>
<rect x="-24" y="-20" width="48" height="36" rx="8" fill="#ffffff" stroke="#b5495b" stroke-width="2"/>
<circle cx="-9" cy="-3" r="4.5" fill="#b5495b"/><circle cx="9" cy="-3" r="4.5" fill="#b5495b"/>
<line x1="-10" y1="8" x2="10" y2="8" stroke="#b5495b" stroke-width="2"/>
<rect x="-30" y="-10" width="6" height="14" rx="2" fill="#b5495b"/><rect x="24" y="-10" width="6" height="14" rx="2" fill="#b5495b"/>
</g>
<text x="170" y="388" font-size="13" fill="#22252a" text-anchor="start" font-weight="600">LLM</text>
<text x="170" y="404" font-size="9.8" fill="#6b7178" text-anchor="start">lee la unidad que el código le da y contesta</text>
<text x="170" y="418" font-size="9.8" fill="#6b7178" text-anchor="start">«¿qué dice esta unidad?» · «¿hacia dónde sigue el rastro?»</text>
<line x1="488" y1="366" x2="488" y2="190" stroke="#b5495b" stroke-width="1.6" marker-end="url(#pr)" stroke-dasharray="3 3"/>
<text x="500" y="200" font-size="9.5" fill="#b5495b" text-anchor="start" font-style="italic">proposiciones tipadas, hacia arriba</text>
<text x="500" y="213" font-size="9.5" fill="#b5495b" text-anchor="start" font-style="italic">nunca control de flujo, hacia abajo</text>
<rect x="226" y="226" width="340" height="44" rx="7" fill="url(#rayas)" stroke="#3b6ea5" stroke-width="1.2"/>
<text x="396" y="245" font-size="11" fill="#3b6ea5" text-anchor="middle" font-weight="700">el bucle es del código</text>
<text x="396" y="260" font-size="9.3" fill="#3b6ea5" text-anchor="middle">cuántas vueltas · qué índice · cuándo parar · qué unidad es el ancla</text>
</svg>