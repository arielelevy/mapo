<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7178"/></marker></defs>
<rect width="940" height="620" fill="#ffffff"/>
<text x="16" y="26" font-size="15.5" font-weight="600" fill="#22252a">Algoritmo 1 — dos de quince líneas llaman al modelo</text>
<text x="16" y="44" font-size="11" fill="#6b7178">el carril inferior es el sensor: emite proposiciones y nunca decide el flujo</text>
<rect x="14" y="58" width="912" height="392" rx="8" fill="#f5f7fa" stroke="#c9ccd1"/>
<rect x="14" y="462" width="912" height="118" rx="8" fill="#fdf4f5" stroke="#c9ccd1"/>
<text x="26" y="76" font-size="10.5" font-weight="700" fill="#2c5c8f">CÓDIGO — determinista</text>
<text x="26" y="480" font-size="10.5" font-weight="700" fill="#b5495b">SENSOR — el modelo</text>
<rect x="36" y="92" width="176" height="48" rx="4" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5"/>
<text x="43" y="107" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="10" fill="#6b7178">1-2</text>
<text x="124.0" y="112" text-anchor="middle" font-size="12.5" fill="#22252a">leer q</text>
<text x="124.0" y="128" text-anchor="middle" font-size="10" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#6b7178">n ← saltos, e ← sujeto</text>
<rect x="252" y="92" width="176" height="48" rx="4" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5"/>
<text x="259" y="107" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="10" fill="#6b7178">3</text>
<text x="340.0" y="112" text-anchor="middle" font-size="12.5" fill="#22252a">elegir índice</text>
<text x="340.0" y="128" text-anchor="middle" font-size="10" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#6b7178">entidad ⇒ léxico</text>
<rect x="468" y="92" width="176" height="48" rx="4" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5"/>
<text x="475" y="107" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="10" fill="#6b7178">4</text>
<text x="556.0" y="112" text-anchor="middle" font-size="12.5" fill="#22252a">resolver ancla</text>
<text x="556.0" y="128" text-anchor="middle" font-size="10" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#6b7178">sin llamar al modelo</text>
<polygon points="772,86.0 847.0,116 772,146.0 697.0,116" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5"/><text x="772" y="120" text-anchor="middle" font-size="11.5" fill="#22252a">¿ancla?</text><text x="703.0" y="100.0" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="10" fill="#6b7178">5</text>
<line x1="212" y1="116" x2="252" y2="116" stroke="#6b7178" stroke-width="1.5" marker-end="url(#p)"/>
<line x1="428" y1="116" x2="468" y2="116" stroke="#6b7178" stroke-width="1.5" marker-end="url(#p)"/>
<line x1="644" y1="116" x2="697" y2="116" stroke="#6b7178" stroke-width="1.5" marker-end="url(#p)"/>
<polygon points="772,195.0 847.0,226 772,257.0 697.0,226" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5"/><text x="772" y="230" text-anchor="middle" font-size="11.5" fill="#22252a">¿i ≤ n?</text><text x="703.0" y="209.0" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="10" fill="#6b7178">7</text>
<rect x="468" y="200" width="176" height="52" rx="4" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5"/>
<text x="475" y="215" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="10" fill="#6b7178">8</text>
<text x="556.0" y="220" text-anchor="middle" font-size="12.5" fill="#22252a">leer unidad</text>
<text x="556.0" y="236" text-anchor="middle" font-size="10" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#6b7178">τ ← leer(u)</text>
<rect x="252" y="200" width="176" height="52" rx="4" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5"/>
<text x="259" y="215" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="10" fill="#6b7178">10-11</text>
<text x="340.0" y="220" text-anchor="middle" font-size="12.5" fill="#22252a">tipar y rutear</text>
<text x="340.0" y="236" text-anchor="middle" font-size="10" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#6b7178">ρ ← entidad(ρ); ι ← índice(ρ)</text>
<rect x="36" y="200" width="176" height="52" rx="4" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5"/>
<text x="43" y="215" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="10" fill="#6b7178">12</text>
<text x="124.0" y="220" text-anchor="middle" font-size="12.5" fill="#22252a">buscar y filtrar</text>
<text x="124.0" y="236" text-anchor="middle" font-size="10" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#6b7178">hit que NOMBRA a ρ</text>
<line x1="772" y1="146" x2="772" y2="195" stroke="der" stroke-width="1.5" marker-end="url(#p)"/>
<text x="779.0" y="174.5" text-anchor="start" font-size="10" font-style="italic" fill="der">sí</text>
<line x1="697" y1="226" x2="644" y2="226" stroke="#6b7178" stroke-width="1.5" marker-end="url(#p)"/>
<line x1="468" y1="226" x2="428" y2="226" stroke="#6b7178" stroke-width="1.5" marker-end="url(#p)"/>
<line x1="252" y1="226" x2="212" y2="226" stroke="#6b7178" stroke-width="1.5" marker-end="url(#p)"/>
<polygon points="124,302.0 204.0,332 124,362.0 44.0,332" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5"/><text x="124" y="336" text-anchor="middle" font-size="11.5" fill="#22252a">¿hit?</text><text x="50.0" y="316.0" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="10" fill="#6b7178">13</text>
<line x1="124" y1="252" x2="124" y2="302" stroke="#6b7178" stroke-width="1.5" marker-end="url(#p)"/>
<path d="M 204 332 L 700 332 L 700 290 L 772 290 L 772 288" fill="none" stroke="#6b7178" stroke-width="1.5" marker-end="url(#p)"/>
<text x="440" y="326" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7178">sí · i ← i+1</text>
<rect x="40.0" y="393.0" width="168" height="34" rx="17.0" fill="#ffffff" stroke="#b5495b" stroke-width="1.8"/><text x="124" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#b5495b">ABSTENER</text>
<line x1="124" y1="362" x2="124" y2="393" stroke="izq" stroke-width="1.5" marker-end="url(#p)"/>
<text x="131.0" y="381.5" text-anchor="start" font-size="10" font-style="italic" fill="izq">no</text>
<path d="M 847 116 L 906 116 L 906 452 L 124 452 L 124 427" fill="none" stroke="#b5495b" stroke-width="1.5" marker-end="url(#p)"/>
<text x="898" y="110" text-anchor="end" font-size="10" font-style="italic" fill="#b5495b">no</text>
<rect x="700" y="496" width="190" height="56" rx="4" fill="#ffffff" stroke="#b5495b" stroke-width="2.4"/>
<text x="707" y="511" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="10" fill="#6b7178">15</text>
<text x="795.0" y="516" text-anchor="middle" font-size="12.5" fill="#22252a">¿cuál es el valor?</text>
<text x="795.0" y="532" text-anchor="middle" font-size="10" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#6b7178">sobre camino[n]</text>
<rect x="700.0" y="393.0" width="190" height="34" rx="17.0" fill="#ffffff" stroke="#2e8b6f" stroke-width="1.8"/><text x="795" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#2e8b6f">valor pedido</text>
<path d="M 772 257 L 772 344 L 700 344 L 700 470 L 740 470 L 740 496" fill="none" stroke="#6b7178" stroke-width="1.5" marker-end="url(#p)"/>
<text x="766" y="336" text-anchor="end" font-size="10" font-style="italic" fill="#6b7178">no · i &gt; n · camino[n]</text>
<path d="M 850 496 L 850 427" fill="none" stroke="#b5495b" stroke-width="1.5" marker-end="url(#p)"/>
<rect x="468" y="496" width="176" height="56" rx="4" fill="#ffffff" stroke="#b5495b" stroke-width="2.4"/>
<text x="475" y="511" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="10" fill="#6b7178">9</text>
<text x="556.0" y="516" text-anchor="middle" font-size="12.5" fill="#22252a">¿hacia dónde sigue?</text>
<text x="556.0" y="532" text-anchor="middle" font-size="10" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#6b7178">una proposición</text>
<path d="M 578 252 L 578 496" fill="none" stroke="#b5495b" stroke-width="1.5" marker-end="url(#p)"/>
<path d="M 468 512 L 340 512 L 340 252" fill="none" stroke="#b5495b" stroke-width="1.5" marker-end="url(#p)"/>
<text x="584" y="478" font-size="10" font-style="italic" fill="#b5495b">τ  el texto</text>
<text x="346" y="478" font-size="10" font-style="italic" fill="#b5495b">ρ  la proposición</text>
<text x="16" y="604" font-size="10.5" fill="#6b7178">Las líneas 3 y 11 aplican la regla de creencias; la 10 tipa la salida del sensor; la 7 pone el largo bajo control del código; la 4 resuelve el ancla sin preguntar.</text>
