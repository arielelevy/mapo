<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/>
    </marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="900" height="650" fill="none"/>
  <rect width="900" height="650" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <rect x="25" y="18" width="850" height="56" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="450" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">VERIFY, DON'T PREDICT</text>
  <text x="450" y="64" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">a cascade turns a quality loss into a cost loss</text>

  <!-- The partition -->
  <rect x="25" y="88" width="850" height="66" rx="4" fill="#141414" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="110" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3b82f6" text-anchor="middle" letter-spacing="1">THE VERIFIABILITY PARTITION</text>
  <text x="245" y="133" font-family="monospace" font-size="12" fill="#22c55e" text-anchor="middle">v = 1  (cheap oracle exists)</text>
  <text x="245" y="149" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">CASCADE — no router needed</text>
  <line x1="450" y1="118" x2="450" y2="150" stroke="#333333" stroke-width="1"/>
  <text x="660" y="133" font-family="monospace" font-size="12" fill="#f59e0b" text-anchor="middle">v = 0  (no oracle)</text>
  <text x="660" y="149" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ROUTE — Theorem 1 applies</text>

  <!-- ===== LEFT: the router ===== -->
  <rect x="25" y="168" width="415" height="300" rx="4" fill="#121212" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="232" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ef4444" text-anchor="middle">A ROUTER PREDICTS</text>

  <rect x="55" y="206" width="150" height="46" rx="6" fill="#141414" stroke="#666666" stroke-width="1.5"/>
  <text x="130" y="234" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">task arrives</text>

  <line x1="205" y1="229" x2="252" y2="229" stroke="#666666" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="257" y="206" width="150" height="46" rx="6" fill="#141414" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="227" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">predict a paradigm</text>
  <text x="332" y="243" font-family="Arial, sans-serif" font-size="9" fill="#888888" text-anchor="middle">commits before evidence</text>

  <line x1="332" y1="252" x2="332" y2="288" stroke="#ef4444" stroke-width="2" marker-end="url(#a1)"/>
  <text x="345" y="275" font-family="Arial, sans-serif" font-size="10" fill="#ef4444">wrong</text>

  <rect x="207" y="294" width="250" height="62" rx="6" fill="#141414" stroke="#ef4444" stroke-width="2" filter="url(#glow)"/>
  <text x="332" y="316" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ef4444" text-anchor="middle">pays a QUALITY loss  L</text>
  <text x="332" y="334" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">a worse answer is delivered</text>
  <text x="332" y="349" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">and nothing recovers it</text>

  <!-- heavy tail evidence -->
  <rect x="55" y="376" width="360" height="76" rx="6" fill="#141414" stroke="#333333" stroke-width="1"/>
  <text x="235" y="395" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">L is heavy-tailed — measured, not assumed</text>
  <text x="70" y="414" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">CoT on HumanEval</text>
  <text x="400" y="414" font-family="monospace" font-size="10" fill="#ef4444" text-anchor="end">−15 pp</text>
  <text x="70" y="431" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">Qwen3-30B zero-shot self-routing</text>
  <text x="400" y="431" font-family="monospace" font-size="10" fill="#ef4444" text-anchor="end">→ 27.5%</text>
  <text x="70" y="446" font-family="Arial, sans-serif" font-size="9" fill="#888888">below its own baseline: routing badly is worse than not routing</text>

  <!-- ===== RIGHT: the cascade ===== -->
  <rect x="460" y="168" width="415" height="300" rx="4" fill="#121212" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="667" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#22c55e" text-anchor="middle">A CASCADE VERIFIES</text>

  <rect x="485" y="206" width="112" height="40" rx="6" fill="#141414" stroke="#22c55e" stroke-width="1.5"/>
  <text x="541" y="223" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">try cheapest</text>
  <text x="541" y="238" font-family="Arial, sans-serif" font-size="9" fill="#888888" text-anchor="middle">direct</text>

  <line x1="597" y1="226" x2="628" y2="226" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="633" y="206" width="100" height="40" rx="6" fill="#141414" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="683" y="223" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">verify</text>
  <text x="683" y="238" font-family="Arial, sans-serif" font-size="9" fill="#888888" text-anchor="middle">the oracle</text>

  <line x1="733" y1="226" x2="764" y2="226" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="769" y="206" width="86" height="40" rx="6" fill="#141414" stroke="#22c55e" stroke-width="1.5"/>
  <text x="812" y="230" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#22c55e" text-anchor="middle">done</text>

  <!-- escalation -->
  <line x1="683" y1="246" x2="683" y2="278" stroke="#f59e0b" stroke-width="2" marker-end="url(#a1)"/>
  <text x="694" y="266" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b">failed</text>

  <rect x="583" y="284" width="200" height="40" rx="6" fill="#141414" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="683" y="308" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">escalate to the next rung</text>

  <rect x="510" y="336" width="320" height="62" rx="6" fill="#141414" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
  <text x="670" y="358" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#22c55e" text-anchor="middle">pays a COST loss only</text>
  <text x="670" y="376" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">the wasted cheap attempt — then the</text>
  <text x="670" y="391" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">good answer still arrives</text>

  <text x="667" y="424" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Prediction is only necessary where</text>
  <text x="667" y="440" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">verification is impossible.</text>
  <text x="667" y="457" font-family="Arial, sans-serif" font-size="9" fill="#888888" text-anchor="middle">which is what makes the partition, not a preference, the design rule</text>

  <!-- ===== the measured correction ===== -->
  <rect x="25" y="482" width="850" height="152" rx="4" fill="#121212" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="450" y="506" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="1">⚠ WHAT MEASUREMENT CORRECTED</text>

  <rect x="50" y="520" width="390" height="46" rx="5" fill="#141414" stroke="#ef4444" stroke-width="1.5"/>
  <text x="62" y="538" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ef4444">claimed</text>
  <text x="122" y="538" font-family="monospace" font-size="11" fill="#cccccc">cost(p₁) &lt; β · L</text>
  <text x="62" y="556" font-family="Arial, sans-serif" font-size="10" fill="#888888">bounded by the first rung — false</text>

  <rect x="460" y="520" width="390" height="46" rx="5" fill="#141414" stroke="#22c55e" stroke-width="1.5"/>
  <text x="472" y="538" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#22c55e">actual</text>
  <text x="524" y="538" font-family="monospace" font-size="11" fill="#cccccc">E[ladder cost] &lt; β · L</text>
  <text x="472" y="556" font-family="Arial, sans-serif" font-size="10" fill="#888888">no rung satisfies the oracle → the whole ladder runs</text>

  <rect x="50" y="576" width="255" height="46" rx="5" fill="#141414" stroke="#333333" stroke-width="1"/>
  <text x="177" y="594" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">captured 100% of the gap at</text>
  <text x="177" y="612" font-family="monospace" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">4.4× the token cost</text>

  <rect x="320" y="576" width="255" height="46" rx="5" fill="#141414" stroke="#333333" stroke-width="1"/>
  <text x="447" y="594" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">detector sensitivity 0.6 →</text>
  <text x="447" y="612" font-family="monospace" font-size="13" font-weight="bold" fill="#ef4444" text-anchor="middle">captured −5.98</text>

  <rect x="590" y="576" width="260" height="46" rx="5" fill="#141414" stroke="#22c55e" stroke-width="1"/>
  <text x="720" y="592" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#22c55e" text-anchor="middle">required design addition</text>
  <text x="720" y="608" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">budget cap on the ladder,</text>
  <text x="720" y="620" font-family="Arial, sans-serif" font-size="9" fill="#888888" text-anchor="middle">and log what was cut</text>
</svg>
