<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666666"/>
    </marker>
    <marker id="arrowWhite" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e5e5e5"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="none"/>
  <rect width="900" height="600" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <rect x="25" y="18" width="850" height="56" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="450" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">THE BELIEF LAYER</text>
  <text x="450" y="64" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">the model is a sensor, symbolic rules are the decider</text>

  <!-- ==== STAGE 1: the sensor (stochastic) ==== -->
  <rect x="25" y="95" width="215" height="330" rx="4" fill="#121212" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="132" y="120" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="1">STOCHASTIC</text>

  <rect x="50" y="140" width="165" height="70" rx="8" fill="#141414" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
  <text x="132" y="168" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">LLM</text>
  <text x="132" y="188" font-family="Arial, sans-serif" font-size="11" fill="#999999" text-anchor="middle">as instrument</text>

  <rect x="50" y="232" width="165" height="60" rx="8" fill="#141414" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="132" y="256" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Probe</text>
  <text x="132" y="275" font-family="Arial, sans-serif" font-size="10" fill="#999999" text-anchor="middle">executes one unit</text>

  <rect x="50" y="314" width="165" height="60" rx="8" fill="#141414" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
  <text x="132" y="338" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Pure functions</text>
  <text x="132" y="357" font-family="Arial, sans-serif" font-size="10" fill="#999999" text-anchor="middle">counting, flags</text>

  <text x="132" y="404" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">no amount of pinning makes</text>
  <text x="132" y="417" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">an LLM deterministic</text>

  <!-- arrows into the belief base -->
  <line x1="215" y1="175" x2="285" y2="200" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="215" y1="262" x2="285" y2="262" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="215" y1="344" x2="285" y2="320" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==== STAGE 2: the belief base ==== -->
  <rect x="290" y="95" width="285" height="330" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="432" y="120" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">BELIEF BASE</text>
  <text x="432" y="136" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">append-only · content-addressed</text>

  <!-- belief rows: provenance ordered strongest to weakest -->
  <rect x="308" y="150" width="250" height="46" rx="6" fill="#141414" stroke="#22c55e" stroke-width="1.5"/>
  <text x="320" y="169" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">n_units = 40</text>
  <text x="320" y="186" font-family="Arial, sans-serif" font-size="9" fill="#22c55e">COMPUTED · credence 1.0 · counted</text>

  <rect x="308" y="204" width="250" height="46" rx="6" fill="#141414" stroke="#22c55e" stroke-width="1.5"/>
  <text x="320" y="223" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">irreversible = true</text>
  <text x="320" y="240" font-family="Arial, sans-serif" font-size="9" fill="#22c55e">COMPUTED · credence 1.0 · declared</text>

  <rect x="308" y="258" width="250" height="46" rx="6" fill="#141414" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="277" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">coupling_tight = false</text>
  <text x="320" y="294" font-family="Arial, sans-serif" font-size="9" fill="#3b82f6">OBSERVED · credence 0.6 · probe measured</text>

  <rect x="308" y="312" width="250" height="46" rx="6" fill="#141414" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.55"/>
  <text x="320" y="331" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#999999">coupling_tight = true</text>
  <text x="320" y="348" font-family="Arial, sans-serif" font-size="9" fill="#f59e0b">ELICITED · credence 0.99 · superseded</text>

  <text x="432" y="381" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#3b82f6" text-anchor="middle">evidence beats opinion</text>
  <text x="432" y="396" font-family="Arial, sans-serif" font-size="9" fill="#666666" text-anchor="middle">superseded beliefs are retained, never overwritten</text>
  <text x="432" y="413" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">digest 01e8126a797c8a7b</text>

  <line x1="575" y1="262" x2="640" y2="262" stroke="#e5e5e5" stroke-width="2" marker-end="url(#arrowWhite)"/>

  <!-- ==== STAGE 3: governance (deterministic) ==== -->
  <rect x="645" y="95" width="230" height="330" rx="4" fill="#121212" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="760" y="120" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#22c55e" text-anchor="middle" letter-spacing="1">DETERMINISTIC</text>

  <rect x="665" y="140" width="190" height="118" rx="8" fill="#141414" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
  <text x="760" y="163" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Governance</text>
  <text x="678" y="184" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">rules as DATA, by priority</text>
  <text x="678" y="201" font-family="Arial, sans-serif" font-size="9" fill="#999999">100 irreversible → gate</text>
  <text x="678" y="216" font-family="Arial, sans-serif" font-size="9" fill="#999999">90 has_oracle → cascade</text>
  <text x="678" y="231" font-family="Arial, sans-serif" font-size="9" fill="#999999">80 unmeasured → probe</text>
  <text x="678" y="246" font-family="Arial, sans-serif" font-size="9" fill="#999999">70 margin ≥ τ → specialise</text>

  <rect x="665" y="280" width="190" height="78" rx="8" fill="#141414" stroke="#e5e5e5" stroke-width="1.5" filter="url(#glow)"/>
  <text x="760" y="303" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Verdict + trace</text>
  <text x="760" y="322" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">action · fired rule</text>
  <text x="760" y="338" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">every check, met or not</text>
  <text x="760" y="352" font-family="Arial, sans-serif" font-size="9" fill="#888888" text-anchor="middle">the audit artifact</text>

  <text x="760" y="385" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">a rule may demand a minimum</text>
  <text x="760" y="398" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">provenance, not just a value</text>
  <text x="760" y="415" font-family="Arial, sans-serif" font-size="9" fill="#22c55e" text-anchor="middle">pure: same base → same verdict</text>

  <!-- ==== the guarantee ==== -->
  <rect x="25" y="440" width="850" height="140" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="450" y="465" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">THE GUARANTEE CHANGES SHAPE</text>

  <rect x="55" y="481" width="380" height="42" rx="6" fill="#141414" stroke="#ef4444" stroke-width="1.5"/>
  <text x="72" y="498" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ef4444">NOT</text>
  <text x="118" y="498" font-family="Arial, sans-serif" font-size="11" fill="#cccccc">"the same prompt yields the same answer"</text>
  <text x="118" y="514" font-family="Arial, sans-serif" font-size="10" fill="#888888">false, always — and chasing it discards real information</text>

  <rect x="465" y="481" width="380" height="42" rx="6" fill="#141414" stroke="#22c55e" stroke-width="1.5"/>
  <text x="482" y="498" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#22c55e">BUT</text>
  <text x="524" y="498" font-family="Arial, sans-serif" font-size="11" fill="#cccccc">"the same belief base yields the same decision"</text>
  <text x="524" y="514" font-family="Arial, sans-serif" font-size="10" fill="#888888">true, and the base is a recorded artifact</text>

  <text x="450" y="545" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">An auditor never replays the model. They inspect what it asserted, with what confidence and on what evidence,</text>
  <text x="450" y="562" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">and replay the rules over it.</text>
</svg>
