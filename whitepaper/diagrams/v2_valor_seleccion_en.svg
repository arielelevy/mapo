<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="620" fill="none"/>
  <rect width="900" height="620" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <rect x="25" y="18" width="850" height="56" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="450" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">THE SELECTION VALUE THEOREM</text>
  <text x="450" y="64" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">the optimal router abstains most of the time</text>

  <!-- The condition -->
  <rect x="25" y="88" width="850" height="52" rx="4" fill="#141414" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="112" font-family="monospace" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">π · α · G   &gt;   (1 − π) · β · L</text>
  <text x="450" y="131" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">π share where specialising helps · α recall · β false-positive rate · G gain on those · L loss when misrouted</text>

  <!-- Plot frame -->
  <rect x="25" y="152" width="600" height="420" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- axes -->
  <line x1="100" y1="160" x2="100" y2="530" stroke="#666666" stroke-width="1.5"/>
  <line x1="100" y1="440" x2="600" y2="440" stroke="#666666" stroke-width="1.5"/>

  <!-- y ticks -->
  <line x1="95" y1="440" x2="100" y2="440" stroke="#666666" stroke-width="1.5"/>
  <text x="88" y="444" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="end">0</text>
  <line x1="95" y1="370" x2="100" y2="370" stroke="#666666" stroke-width="1"/>
  <text x="88" y="374" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="end">0.25</text>
  <line x1="95" y1="300" x2="100" y2="300" stroke="#666666" stroke-width="1"/>
  <text x="88" y="304" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="end">0.50</text>
  <line x1="95" y1="230" x2="100" y2="230" stroke="#666666" stroke-width="1"/>
  <text x="88" y="234" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="end">0.75</text>
  <line x1="95" y1="160" x2="100" y2="160" stroke="#666666" stroke-width="1"/>
  <text x="88" y="164" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="end">1.00</text>
  <line x1="95" y1="510" x2="100" y2="510" stroke="#666666" stroke-width="1"/>
  <text x="88" y="514" font-family="Arial, sans-serif" font-size="10" fill="#ef4444" text-anchor="end">−0.25</text>

  <text x="44" y="330" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle" transform="rotate(-90 44 330)">fraction of oracle gap captured</text>

  <!-- x ticks -->
  <line x1="100" y1="440" x2="100" y2="445" stroke="#666666" stroke-width="1.5"/>
  <text x="100" y="460" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">0</text>
  <line x1="240" y1="440" x2="240" y2="445" stroke="#666666" stroke-width="1"/>
  <text x="240" y="460" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">0.2</text>
  <line x1="380" y1="440" x2="380" y2="445" stroke="#666666" stroke-width="1"/>
  <text x="380" y="460" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">0.4</text>
  <line x1="520" y1="440" x2="520" y2="445" stroke="#666666" stroke-width="1"/>
  <text x="520" y="460" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">0.7</text>
  <line x1="600" y1="440" x2="600" y2="445" stroke="#666666" stroke-width="1.5"/>
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">1.0</text>
  <text x="350" y="481" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">coverage — the share of requests that receive a specialised paradigm</text>

  <!-- zero line extended -->
  <line x1="100" y1="440" x2="600" y2="440" stroke="#444444" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ==== the good router: selective, calibrated ==== -->
  <path d="M 100 440 Q 150 370 205 322 T 290 294 Q 340 296 380 306 T 520 344 L 600 367"
        fill="none" stroke="#22c55e" stroke-width="3" filter="url(#glow)"/>

  <!-- optimum marker -->
  <circle cx="290" cy="294" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  <line x1="290" y1="294" x2="290" y2="440" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="228" y="243" width="126" height="42" rx="5" fill="#141414" stroke="#22c55e" stroke-width="1.5"/>
  <text x="291" y="260" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#22c55e" text-anchor="middle">optimum c*</text>
  <text x="291" y="276" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">coverage ≪ 1</text>

  <!-- full coverage marker: the published result -->
  <circle cx="600" cy="367" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <rect x="452" y="386" width="160" height="44" rx="5" fill="#141414" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="532" y="403" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle">published routers sit here</text>
  <text x="532" y="419" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">forced to coverage 1.0 · ~26%</text>

  <!-- ==== the bad router: beta above beta_max ==== -->
  <path d="M 100 440 Q 170 432 240 442 T 380 478 T 520 504 L 600 518"
        fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="470" y="538" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ef4444">β &gt; β_max — loses to always-fallback</text>

  <!-- legend -->
  <rect x="122" y="172" width="220" height="56" rx="5" fill="#141414" stroke="#333333" stroke-width="1"/>
  <line x1="134" y1="189" x2="162" y2="189" stroke="#22c55e" stroke-width="3"/>
  <text x="170" y="193" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">selective, calibrated confidence</text>
  <line x1="134" y1="212" x2="162" y2="212" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="170" y="216" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">high false-positive rate</text>

  <!-- ==== corollaries ==== -->
  <rect x="640" y="152" width="235" height="420" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="757" y="176" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">COROLLARIES</text>

  <rect x="655" y="192" width="205" height="108" rx="6" fill="#141414" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="668" y="211" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3b82f6">1 · precision over coverage</text>
  <text x="668" y="231" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">When the fallback is near-optimal</text>
  <text x="668" y="246" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">over wide regions, G is small and</text>
  <text x="668" y="261" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">L is large. Minimise β even at</text>
  <text x="668" y="276" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">the cost of α.</text>
  <text x="668" y="292" font-family="Arial, sans-serif" font-size="9" fill="#888888">recall is not the objective</text>

  <rect x="655" y="312" width="205" height="108" rx="6" fill="#141414" stroke="#ef4444" stroke-width="1.5"/>
  <text x="668" y="331" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ef4444">2 · impossibility threshold</text>
  <text x="668" y="352" font-family="monospace" font-size="11" fill="#ffffff">β_max = π·α·G / ((1−π)·L)</text>
  <text x="668" y="373" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">Any router above it loses to</text>
  <text x="668" y="388" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">always-fallback, however good</text>
  <text x="668" y="403" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">its specialised patterns are.</text>

  <rect x="655" y="432" width="205" height="124" rx="6" fill="#141414" stroke="#22c55e" stroke-width="1.5"/>
  <text x="668" y="451" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#22c55e">3 · optimal coverage</text>
  <text x="668" y="472" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">A router obliged to always choose</text>
  <text x="668" y="487" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">has no control over β at all. It</text>
  <text x="668" y="502" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">pays every false positive.</text>
  <text x="668" y="524" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Deferral makes coverage a</text>
  <text x="668" y="539" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">design parameter.</text>

  <!-- identity footnote -->
  <rect x="25" y="582" width="850" height="30" rx="4" fill="#141414" stroke="#333333" stroke-width="1"/>
  <text x="450" y="601" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">Useful identity: the oracle gap equals π · G — so a published router's headline numbers determine its implied β.</text>
</svg>
