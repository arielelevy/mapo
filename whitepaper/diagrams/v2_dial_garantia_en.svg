<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="none"/>
  <rect width="900" height="620" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <rect x="25" y="18" width="850" height="56" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="450" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">ASSURANCE IS A PER-REQUEST DIAL</text>
  <text x="450" y="64" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">the level constrains the admissible pattern space; plasticity permutes inside it</text>

  <!-- axis label -->
  <text x="45" y="103" font-family="Arial, sans-serif" font-size="10" fill="#22c55e" letter-spacing="1">FLEXIBLE · CHEAP · DEFAULT</text>
  <text x="855" y="103" font-family="Arial, sans-serif" font-size="10" fill="#ef4444" text-anchor="end" letter-spacing="1">STRICT · COSTLY · ESCALATION</text>
  <line x1="45" y1="112" x2="855" y2="112" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== A0 ===== -->
  <rect x="30" y="125" width="200" height="255" rx="4" fill="#121212" stroke="#22c55e" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="130" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e" text-anchor="middle">A0 EXPLORATORY</text>
  <line x1="50" y1="160" x2="210" y2="160" stroke="#333333" stroke-width="1"/>
  <text x="50" y="180" font-family="Arial, sans-serif" font-size="10" fill="#888888">provenance floor</text>
  <text x="210" y="180" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="end">ASSUMED</text>
  <text x="50" y="199" font-family="Arial, sans-serif" font-size="10" fill="#888888">θ learns online</text>
  <text x="210" y="199" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#22c55e" text-anchor="end">YES</text>
  <text x="50" y="218" font-family="Arial, sans-serif" font-size="10" fill="#888888">sealed replay</text>
  <text x="210" y="218" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="end">no</text>
  <text x="50" y="237" font-family="Arial, sans-serif" font-size="10" fill="#888888">logs belief base</text>
  <text x="210" y="237" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="end">no</text>

  <rect x="50" y="252" width="160" height="72" rx="6" fill="#141414" stroke="#22c55e" stroke-width="1.5" filter="url(#glow)"/>
  <text x="130" y="275" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="130" y="293" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">patterns admissible</text>
  <text x="130" y="313" font-family="Arial, sans-serif" font-size="9" fill="#22c55e" text-anchor="middle">full algebra</text>

  <text x="130" y="348" font-family="Arial, sans-serif" font-size="9" fill="#666666" text-anchor="middle">research and low-stakes</text>
  <text x="130" y="362" font-family="Arial, sans-serif" font-size="9" fill="#666666" text-anchor="middle">traffic — which is most traffic</text>

  <!-- ===== A1 ===== -->
  <rect x="240" y="125" width="200" height="255" rx="4" fill="#121212" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="340" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3b82f6" text-anchor="middle">A1 STANDARD</text>
  <line x1="260" y1="160" x2="420" y2="160" stroke="#333333" stroke-width="1"/>
  <text x="260" y="180" font-family="Arial, sans-serif" font-size="10" fill="#888888">provenance floor</text>
  <text x="420" y="180" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b" text-anchor="end">ELICITED</text>
  <text x="260" y="199" font-family="Arial, sans-serif" font-size="10" fill="#888888">θ learns online</text>
  <text x="420" y="199" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="end">no, frozen</text>
  <text x="260" y="218" font-family="Arial, sans-serif" font-size="10" fill="#888888">sealed replay</text>
  <text x="420" y="218" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="end">no</text>
  <text x="260" y="237" font-family="Arial, sans-serif" font-size="10" fill="#888888">logs belief base</text>
  <text x="420" y="237" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="end">no</text>

  <rect x="260" y="252" width="160" height="72" rx="6" fill="#141414" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="340" y="275" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="340" y="293" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">patterns admissible</text>
  <text x="340" y="313" font-family="Arial, sans-serif" font-size="9" fill="#3b82f6" text-anchor="middle">catalogue</text>

  <text x="340" y="348" font-family="Arial, sans-serif" font-size="9" fill="#666666" text-anchor="middle">the sensible production</text>
  <text x="340" y="362" font-family="Arial, sans-serif" font-size="9" fill="#666666" text-anchor="middle">default</text>

  <!-- ===== A2 ===== -->
  <rect x="450" y="125" width="200" height="255" rx="4" fill="#121212" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="550" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">A2 ACCOUNTABLE</text>
  <line x1="470" y1="160" x2="630" y2="160" stroke="#333333" stroke-width="1"/>
  <text x="470" y="180" font-family="Arial, sans-serif" font-size="10" fill="#888888">provenance floor</text>
  <text x="630" y="180" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b" text-anchor="end">ELICITED *</text>
  <text x="470" y="199" font-family="Arial, sans-serif" font-size="10" fill="#888888">θ learns online</text>
  <text x="630" y="199" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="end">no, signed</text>
  <text x="470" y="218" font-family="Arial, sans-serif" font-size="10" fill="#888888">sealed replay</text>
  <text x="630" y="218" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="end">no</text>
  <text x="470" y="237" font-family="Arial, sans-serif" font-size="10" fill="#888888">logs belief base</text>
  <text x="630" y="237" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="end">YES</text>

  <rect x="470" y="252" width="160" height="72" rx="6" fill="#141414" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
  <text x="550" y="275" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="550" y="293" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">patterns, depth ≤ 3</text>
  <text x="550" y="313" font-family="Arial, sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">composition capped</text>

  <text x="550" y="348" font-family="Arial, sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">* rises to OBSERVED while</text>
  <text x="550" y="362" font-family="Arial, sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">calibration is unearned</text>

  <!-- ===== A3 ===== -->
  <rect x="660" y="125" width="210" height="255" rx="4" fill="#121212" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="765" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">A3 CERTIFIED</text>
  <line x1="680" y1="160" x2="850" y2="160" stroke="#333333" stroke-width="1"/>
  <text x="680" y="180" font-family="Arial, sans-serif" font-size="10" fill="#888888">provenance floor</text>
  <text x="850" y="180" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#3b82f6" text-anchor="end">OBSERVED</text>
  <text x="680" y="199" font-family="Arial, sans-serif" font-size="10" fill="#888888">θ learns online</text>
  <text x="850" y="199" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="end">no, pinned+signed</text>
  <text x="680" y="218" font-family="Arial, sans-serif" font-size="10" fill="#888888">sealed replay</text>
  <text x="850" y="218" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="end">YES</text>
  <text x="680" y="237" font-family="Arial, sans-serif" font-size="10" fill="#888888">logs belief base</text>
  <text x="850" y="237" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="end">YES</text>

  <rect x="680" y="252" width="170" height="72" rx="6" fill="#141414" stroke="#ef4444" stroke-width="1.5" filter="url(#glow)"/>
  <text x="765" y="275" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="765" y="293" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">patterns admissible</text>
  <text x="765" y="313" font-family="Arial, sans-serif" font-size="9" fill="#ef4444" text-anchor="middle">certified subset</text>

  <text x="765" y="348" font-family="Arial, sans-serif" font-size="9" fill="#666666" text-anchor="middle">EXCLUDED: dag_strategy,</text>
  <text x="765" y="362" font-family="Arial, sans-serif" font-size="9" fill="#666666" text-anchor="middle">plan_execute, reflection</text>

  <!-- ===== the crucial note ===== -->
  <rect x="30" y="395" width="840" height="66" rx="4" fill="#141414" stroke="#ef4444" stroke-width="1.5"/>
  <text x="450" y="418" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">A3 excludes those patterns NOT because they are worse — they are often better</text>
  <text x="450" y="437" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">but because their control flow is unbounded and their failure modes are not enumerable.</text>
  <text x="450" y="453" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">That is why A3 is an escalation and not a default.</text>

  <!-- ===== the floor override ===== -->
  <rect x="30" y="475" width="840" height="120" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="450" y="499" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">THE FLOOR IS DERIVED FROM BELIEFS — A CALLER MAY ASK FOR MORE, NEVER LESS</text>

  <rect x="60" y="515" width="185" height="58" rx="6" fill="#141414" stroke="#22c55e" stroke-width="1.5"/>
  <text x="152" y="537" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">caller requests</text>
  <text x="152" y="557" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#22c55e" text-anchor="middle">A0 EXPLORATORY</text>

  <rect x="290" y="515" width="230" height="58" rx="6" fill="#141414" stroke="#22c55e" stroke-width="1.5"/>
  <text x="405" y="533" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">belief, COMPUTED, credence 1.0</text>
  <text x="405" y="553" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">irreversible = true</text>
  <text x="405" y="567" font-family="Arial, sans-serif" font-size="9" fill="#666666" text-anchor="middle">forces the floor to A3</text>

  <line x1="245" y1="544" x2="288" y2="544" stroke="#666666" stroke-width="1.5"/>
  <line x1="520" y1="544" x2="590" y2="544" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowUp)"/>

  <rect x="595" y="515" width="245" height="58" rx="6" fill="#141414" stroke="#ef4444" stroke-width="2" filter="url(#glow)"/>
  <text x="717" y="533" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">resolved level</text>
  <text x="717" y="553" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">A3 CERTIFIED</text>
  <text x="717" y="567" font-family="Arial, sans-serif" font-size="9" fill="#888888" text-anchor="middle">plan space 7 → 4 patterns</text>
</svg>
