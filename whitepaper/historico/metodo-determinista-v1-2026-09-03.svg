<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7178"/></marker></defs>
<rect width="980" height="560" fill="#ffffff"/>
<rect x="16" y="52" width="948" height="330" rx="10" fill="#f4f7fa" stroke="#d8dbdf"/>
<rect x="16" y="392" width="948" height="120" rx="10" fill="#fdf5f6" stroke="#d8dbdf"/>
<text x="30" y="74" font-size="11.5" font-weight="700" fill="#3b6ea5">LO QUE DECIDE EL CÓDIGO — determinista, contable, auditable</text>
<text x="30" y="414" font-size="11.5" font-weight="700" fill="#b5495b">LO QUE EMITE EL MODELO — sensor: proposiciones, nunca flujo de control</text>
<text x="16" y="30" font-size="17" font-weight="600" fill="#22252a">Cómo se decide un request</text>
<text x="16" y="46" font-size="11" fill="#6b7178">la frontera entre los dos carriles es la única decisión de diseño que el registro muestra que importa</text>
<rect x="34" y="88" width="196" height="74" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.8"/>
<text x="132.0" y="109" text-anchor="middle" font-size="13.5" font-weight="600" fill="#22252a">1 · sensores</text>
<text x="132.0" y="127" text-anchor="middle" font-size="9.8" fill="#6b7178">forma cerrada sobre la pregunta</text>
<text x="132.0" y="141" text-anchor="middle" font-size="9.8" fill="#6b7178">y el material · sin modelo</text>
<rect x="266" y="88" width="196" height="74" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.8"/>
<text x="364.0" y="109" text-anchor="middle" font-size="13.5" font-weight="600" fill="#22252a">2 · creencias tipadas</text>
<text x="364.0" y="127" text-anchor="middle" font-size="9.8" fill="#6b7178">con procedencia, de menor a mayor:</text>
<text x="364.0" y="141" text-anchor="middle" font-size="9.8" fill="#6b7178">ASSUMED · ELICITED · OBSERVED · COMPUTED</text>
<rect x="498" y="88" width="196" height="74" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.8"/>
<text x="596.0" y="109" text-anchor="middle" font-size="13.5" font-weight="600" fill="#22252a">3 · portón de factibilidad</text>
<text x="596.0" y="127" text-anchor="middle" font-size="9.8" fill="#6b7178">aritmética pura:</text>
<text x="596.0" y="141" text-anchor="middle" font-size="9.8" fill="#6b7178">¿entra en el presupuesto?</text>
<rect x="730" y="88" width="216" height="74" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.8"/>
<text x="838.0" y="109" text-anchor="middle" font-size="13.5" font-weight="600" fill="#22252a">4 · capacidades exigidas</text>
<text x="838.0" y="127" text-anchor="middle" font-size="9.8" fill="#6b7178">ontología de la pregunta →</text>
<text x="838.0" y="141" text-anchor="middle" font-size="9.8" fill="#6b7178">capacidades, no paradigmas</text>
<line x1="230" y1="125" x2="266" y2="125" stroke="#6b7178" stroke-width="1.7" marker-end="url(#punta)"/>
<line x1="462" y1="125" x2="498" y2="125" stroke="#6b7178" stroke-width="1.7" marker-end="url(#punta)"/>
<line x1="694" y1="125" x2="730" y2="125" stroke="#6b7178" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="730" y="208" width="216" height="74" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.8"/>
<text x="838.0" y="229" text-anchor="middle" font-size="13.5" font-weight="600" fill="#22252a">5 · brazos candidatos</text>
<text x="838.0" y="247" text-anchor="middle" font-size="9.8" fill="#6b7178">los que tienen TODAS</text>
<text x="838.0" y="261" text-anchor="middle" font-size="9.8" fill="#6b7178">las capacidades exigidas</text>
<rect x="498" y="208" width="196" height="74" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.8"/>
<text x="596.0" y="229" text-anchor="middle" font-size="13.5" font-weight="600" fill="#22252a">6 · dial de garantía</text>
<text x="596.0" y="247" text-anchor="middle" font-size="9.8" fill="#6b7178">A0–A3 · lo declara el caller,</text>
<text x="596.0" y="261" text-anchor="middle" font-size="9.8" fill="#6b7178">jamás se infiere del texto</text>
<rect x="266" y="208" width="196" height="74" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.8"/>
<text x="364.0" y="229" text-anchor="middle" font-size="13.5" font-weight="600" fill="#22252a">7 · elegir o abstenerse</text>
<text x="364.0" y="247" text-anchor="middle" font-size="9.8" fill="#6b7178">entre los que empatan,</text>
<text x="364.0" y="261" text-anchor="middle" font-size="9.8" fill="#6b7178">el más barato</text>
<rect x="34" y="208" width="196" height="74" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.8"/>
<text x="132.0" y="229" text-anchor="middle" font-size="13.5" font-weight="600" fill="#22252a">8 · EXPLAIN</text>
<text x="132.0" y="247" text-anchor="middle" font-size="9.8" fill="#6b7178">qué se creyó, con qué</text>
<text x="132.0" y="261" text-anchor="middle" font-size="9.8" fill="#6b7178">procedencia, y qué se podó</text>
<line x1="838" y1="162" x2="838" y2="208" stroke="#6b7178" stroke-width="1.7" marker-end="url(#punta)"/>
<line x1="730" y1="245" x2="694" y2="245" stroke="#6b7178" stroke-width="1.7" marker-end="url(#punta)"/>
<line x1="498" y1="245" x2="462" y2="245" stroke="#6b7178" stroke-width="1.7" marker-end="url(#punta)"/>
<line x1="266" y1="245" x2="230" y2="245" stroke="#6b7178" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="266" y="314" width="428" height="52" rx="7" fill="#ffffff" stroke="#2e8b6f" stroke-width="1.8"/>
<text x="480.0" y="335" text-anchor="middle" font-size="13.5" font-weight="600" fill="#22252a">el brazo elegido ejecuta</text>
<text x="480.0" y="353" text-anchor="middle" font-size="9.8" fill="#6b7178">el CÓDIGO lleva el bucle: cuántas vueltas, qué índice, cuándo parar</text>
<line x1="132" y1="282" x2="132" y2="340" stroke="#6b7178" stroke-width="1.7" marker-end="url(#punta)"/>
<line x1="132" y1="340" x2="266" y2="340" stroke="#6b7178" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="266" y="432" width="196" height="62" rx="7" fill="#ffffff" stroke="#b5495b" stroke-width="1.8"/>
<text x="364.0" y="453" text-anchor="middle" font-size="13.5" font-weight="600" fill="#22252a">extraer un hecho</text>
<text x="364.0" y="471" text-anchor="middle" font-size="9.8" fill="#6b7178">«¿qué dice esta unidad?»</text>
<rect x="498" y="432" width="196" height="62" rx="7" fill="#ffffff" stroke="#b5495b" stroke-width="1.8"/>
<text x="596.0" y="453" text-anchor="middle" font-size="13.5" font-weight="600" fill="#22252a">proponer el próximo paso</text>
<text x="596.0" y="471" text-anchor="middle" font-size="9.8" fill="#6b7178">«¿a dónde sigue el rastro?»</text>
<line x1="364" y1="366" x2="364" y2="432" stroke="#b5495b" stroke-width="1.7" marker-end="url(#punta)"/><text x="356.0" y="403.0" text-anchor="end" font-size="10" font-style="italic" fill="#b5495b">pregunta</text>
<line x1="596" y1="432" x2="596" y2="366" stroke="#b5495b" stroke-width="1.7" marker-end="url(#punta)"/><text x="604.0" y="403.0" text-anchor="start" font-size="10" font-style="italic" fill="#b5495b">proposición</text>
<rect x="730" y="426" width="216" height="74" rx="7" fill="#ffffff" stroke="#b5495b" stroke-width="1.8"/>
<text x="838.0" y="447" text-anchor="middle" font-size="13.5" font-weight="600" fill="#22252a">la salida se TIPA</text>
<text x="838.0" y="465" text-anchor="middle" font-size="9.8" fill="#6b7178">«M. Arrieta settlement account»</text>
<text x="838.0" y="479" text-anchor="middle" font-size="9.8" fill="#6b7178">→ entidad: M. Arrieta</text>
<line x1="694" y1="457" x2="730" y2="457" stroke="#b5495b" stroke-width="1.7" marker-end="url(#punta)"/>
<path d="M 838 426 L 838 392 L 694 392 L 694 366" fill="none" stroke="#b5495b" stroke-width="1.7" marker-end="url(#punta)"/>
<text x="16" y="546" font-size="10.5" fill="#6b7178">Una decisión que cruza al carril de abajo se lleva el determinismo con ella: medido, el ancla de una caminata elegida por el modelo dio u=1,000 / 0,000 / 0,000 con la misma huella.</text>
</svg>